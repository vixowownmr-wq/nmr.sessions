<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nmr Sessions</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <header>
        <h1>Nmr Sessions</h1>
        <img src="logo_nmr.jpeg" class="logo_nmr" alt="Logo de Nunca Mas Roto, letras blancas con fondo negro, muy trap">
        <p>Registro interno de sesiones nmr</p>
    </header>

    <main>
        <section class="form-section">
            <h2>Nueva sesión</h2>

            <form id="sessionForm">
                <label for="fecha">Fecha</label>
                <input type="date" id="fecha" name="fecha">

                <label for="horaInicio">Hora de inicio</label>
                <input type="time" id="horaInicio" name="horaInicio">

                <label for="horaTermino">Hora de término</label>
                <input type="time" id="horaTermino" name="horaTermino">

                <label for="estudio">Estudio</label>
                <select id="estudio" name="estudio">
                    <option value="">Selecciona un estudio</option>
                    <option value="Recreo">Recreo</option>
                    <option value="7 Hermanas">7 Hermanas</option>
                </select>

                <label for="artista">Artista / Cliente</label>
                <input type="text" id="artista" name="artista" placeholder="Ej: Tairuz NMR">
                
                <label for="proyecto">Proyecto / Canción</label>
                <input type="text" id="proyecto" name="proyecto" placeholder="Ej: Intro Mixtape">

                <h3>Productores presentes</h3>

                <label>
                    <input type="checkbox" name="productores" value="Vixowow">
                    Vixowow
                </label>

                <label>
                    <input type="checkbox" name="productores" value="Big Santos">
                    Big Santos
                </label>

                <label>
                    <input type="checkbox" name="productores" value="Yan Kev">
                    Yan Kev
                </label>

                <label>
                    <input type="checkbox" name="productores" value="Ariel Lazcano">
                    Ariel Lazcano
                </label>

                <h3>Servicios realizados</h3>

                <label>
                    <input type="checkbox" name="servicios" value="Grabación">
                    Grabación
                </label>

                <label>
                    <input type="checkbox" name="servicios" value="Beatmaking">
                    Beatmaking
                </label>

                <label>
                    <input type="checkbox" name="servicios" value="Producción completa">
                    Producción completa
                </label>

                <label>
                    <input type="checkbox" name="servicios" value="Mezcla">
                    Mezcla
                </label>
                
                <label>
                    <input type="checkbox" name="servicios" value="Mastering">
                    Mastering
                </label>
                
                <label for="detalles">Detalle de la sesión</label>
                <textarea id="detalles" name="detalles" rows="5" placeholder="Ej: Se grabaron voces principales, 
                coros y se ajustó la estructura del beat"></textarea>

                <h3>Costeo</h3>

                <label for="valorSesion">Valor de la sesión</label>
                <input type="number" id="valorSesion" name="valorSesion" placeholder="Ej: 50000">

                <label for="abono">abono</label>
                <input type="number" id="abono" name="abono" placeholder="Ej: 20000">

                <label for="estadoPago">Estado de pago</label>
                <select id="estadoPago" name="estadoPago">
                    <option value="Pendiente">Pendiente</option>
                    <option value="Abonado">Abonado</option>
                    <option value="Pagado">Pagado</option>
                </select>

                <button type="submit">Guardar sesión</button>

            </form>
        </section>

        <section class="sessions-section">
            <h2>Sesiones registradas</h2>
            <div id="estadisticas">
                <p id="totalSesiones">Sesiones: 0</p>
                <p id="totalHoras">Horas trabajadas: 0h</p>
                <p id="totalIngresos">Ingresos: $0</p>
                <p id="totalSaldo">Saldo pendiente: $0</p>
            </div>

            <div id="sessionsContainer"></div>

        </section>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
